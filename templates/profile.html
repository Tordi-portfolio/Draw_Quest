{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<section class="container narrow page-head reveal">
  <p class="eyebrow">Profile</p>
  <h1>Your profile</h1>
</section>
<section class="container narrow">
  <form class="card form-card reveal" method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    <div class="profile-top">
      {% if profile.avatar %}<img class="avatar-lg" src="{{ profile.avatar.url }}" alt="">{% else %}<span class="avatar-lg avatar-fallback">{{ user.username|slice:":1"|upper }}</span>{% endif %}
      <div><b>{{ user.username }}</b><div class="muted">{{ user.email }}</div></div>
    </div>
    <label class="lbl">Avatar {{ form.avatar }}{{ form.avatar.errors }}</label>
    <label class="lbl">Bio {{ form.bio }}{{ form.bio.errors }}</label>
    <label class="lbl">Role {{ form.role }}{{ form.role.errors }}</label>
    <button class="btn btn-primary btn-lg" type="submit">Save changes</button>
  </form>
</section>
{% endblock %}
