{% if page.has_other_pages %}
<nav class="pager" aria-label="Pagination">
  {% if page.has_previous %}<a class="btn btn-ghost btn-sm" href="?{% if qs %}{{ qs }}&amp;{% endif %}page={{ page.previous_page_number }}">← Previous</a>{% else %}<span></span>{% endif %}
  <span class="muted">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn btn-ghost btn-sm" href="?{% if qs %}{{ qs }}&amp;{% endif %}page={{ page.next_page_number }}">Next →</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
